<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Ian Gao’s Main Page</title>
        <link rel="preload" href="./font/TsangerJinKai02.woff2" as="font" type="font/woff2" crossorigin />
        <style>
            @font-face {
                font-family: "TsangerJinKai02";
                src: url("./font/TsangerJinKai02.woff2") format("woff2");
                font-weight: normal;
                font-style: normal;
                font-display: swap;
            }

            :root {
                --bg: #f5f4ed;
                --surface: #ffffff;
                --fg: rgba(36, 41, 47, 0.9);
                --muted: #5c6469;
                --border: #e8e6dc;
                --accent: #c96442;
                --font-display:
                    "TsangerJinKai02", "STKaiti", "KaiTi", -apple-system,
                    BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
                --font-body:
                    "TsangerJinKai02", "STKaiti", "KaiTi", -apple-system,
                    BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
                --header-h: 56px;
                --max-w: 720px;
            }

            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            ::selection {
                background: #cfe6ff;
                color: inherit;
            }

            html {
                scroll-behavior: smooth;
                background: var(--bg);
            }

            body {
                font-family: var(--font-body);
                font-size: 16px;
                line-height: 1.7;
                color: var(--fg);
                letter-spacing: 0.5px;
                -webkit-font-smoothing: subpixel-antialiased;
                background: var(--bg);
                min-height: 100vh;
                display: flex;
                flex-direction: column;
            }

            a {
                color: var(--fg);
                text-decoration: none;
                transition: color 0.2s ease;
            }
            a:hover {
                color: var(--accent);
            }

            /* Header */
            .site-header {
                position: sticky;
                top: 0;
                z-index: 100;
                background: rgba(245, 244, 237, 0.92);
                backdrop-filter: blur(12px);
                -webkit-backdrop-filter: blur(12px);
                border-bottom: 1px solid var(--border);
                height: var(--header-h);
            }
            .header-inner {
                max-width: var(--max-w);
                margin: 0 auto;
                padding: 0 24px;
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 16px;
            }
            .site-logo {
                font-size: 20px;
                font-weight: 800;
                color: var(--fg);
                flex-shrink: 0;
                letter-spacing: -0.02em;
            }
            .site-logo:hover {
                color: var(--accent);
            }

            .header-nav {
                display: flex;
                align-items: center;
                gap: 6px;
                flex-shrink: 0;
            }

            .header-link {
                font-size: 14px;
                color: var(--muted);
                padding: 6px 8px;
                border-radius: 6px;
                transition:
                    color 0.15s,
                    background 0.15s;
            }
            .header-link:hover {
                color: var(--fg);
                background: rgba(0, 0, 0, 0.04);
            }

            /* Main content */
            .main {
                flex: 1;
                max-width: var(--max-w);
                width: 100%;
                margin: 0 auto;
                padding: 0 24px;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .hero-text {
                font-size: clamp(24px, 5vw, 40px);
                font-weight: 600;
                color: var(--fg);
                letter-spacing: 0.05em;
                text-align: center;
                line-height: 1.5;
                opacity: 0;
                animation: fadeIn 0.8s ease 0.2s forwards;
            }

            @keyframes fadeIn {
                from {
                    opacity: 0;
                    transform: translateY(12px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            /* Footer */
            .site-footer {
                text-align: center;
                padding: 24px;
                font-size: 14px;
                color: var(--muted);
                border-top: 1px solid var(--border);
            }
        </style>
    </head>
    <body>
        <!-- Header -->
        <header class="site-header">
            <div class="header-inner">
                <a href="/" class="site-logo">Ian Gao’s Main Page</a>
                <nav class="header-nav">
                    <a
                        href="https://ig505gi.github.io/myBlog/"
                        class="header-link"
                        >Blog</a
                    >
                    <a
                        href="https://github.com/ig505gi"
                        class="header-link"
                        target="_blank"
                        rel="noopener"
                        >Github</a
                    >
                    <a
                        href="https://x.com/ig505gi"
                        class="header-link"
                        target="_blank"
                        rel="noopener"
                        >X</a
                    >
                </nav>
            </div>
        </header>

        <!-- Main -->
        <main class="main">
            <p class="hero-text">别想了，动手去做吧</p>
        </main>

        <!-- Footer -->
        <footer class="site-footer">
            <p>&copy; 2026 Ian Gao’s Main Page</p>
        </footer>
    </body>
</html>
